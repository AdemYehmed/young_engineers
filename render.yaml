# Blueprint Render : service web Flask uniquement (la base PostgreSQL est chez Supabase).
# Aucun secret ici : SECRET_KEY est généré par Render, DATABASE_URL est saisie dans le tableau de bord.
services:
  - type: web
    name: young-engineers-api
    runtime: python
    plan: free
    region: frankfurt          # le plus proche de la Tunisie ; modifiable
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn app:app --workers 2 --threads 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: YE_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Base PostgreSQL hébergée chez Supabase : coller l'adresse « Session pooler » dans Render.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "2"
      # À renseigner dans le tableau de bord Render (jamais dans ce fichier) :
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD_HASH
        sync: false
