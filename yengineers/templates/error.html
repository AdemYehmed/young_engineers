{% extends 'base.html' %}
{% block title %}{{ t('error.title') }} — {{ setting('club_name') }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow center">
    <p class="error-code">{{ code }}</p>
    <h1 class="h2">{{ t('error.404.title') if code == 404 else t('error.title') }}</h1>
    <p class="lead dark">{{ t(message_key) }}</p>
    <a class="btn btn-accent" href="{{ url_for('public.home') }}">{{ t('form.back_home') }}</a>
  </div>
</section>
{% endblock %}
